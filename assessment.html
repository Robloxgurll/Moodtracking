<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self-Assessment Tool</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .error-msg {
      color: crimson;
      font-size: 0.85rem;
    }
    body {
      background-color: #f0ece7;
    }
  </style>
</head>
<body>

<!--Navigation bar + responsive design for mobile devices--> 

  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">MoodTracker Project</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="mood-tracker.html">Mood Tracker</a></li>
          <li class="nav-item"><a class="nav-link" href="self-help.html">Self-Help</a></li>
          <li class="nav-item"><a class="nav-link" href="success-stories.html">Success Stories</a></li>
          <li class="nav-item"><a class="nav-link" href="resources.html">Resources</a></li>

    </div>

    <!--title for the thingy-->
  <main class="container mt-5">
    <header class="mb-4 text-center">
      <h2>Mental Wellness Self-Evaluation</h2>
      <p id="currentDateTime" class="text-muted"></p>
    </header>
    <!-- Form for self-assessment -->
    <form id="selfEvalForm" novalidate>
      <div class="mb-3">
        <label for="fullName" class="form-label">Your Name</label>
        <input type="text" id="fullName" class="form-control" />
        <div id="nameError" class="error-msg"></div>
      </div>

      <!-- Input for hours of sleep -->
      <div class="mb-3">
        <label for="hoursSlept" class="form-label">Hours of Sleep Last Night</label>
        <input type="number" id="hoursSlept" class="form-control" min="0" max="24" />
        <div id="sleepError" class="error-msg"></div>
      </div>

      <!-- Radio buttons for stress level -->
      <div class="mb-3">
  <label class="form-label">Stress Level Right Now</label><br />

  <input type="radio" id="stressLow" name="stressLevel" value="Low" />
  <label for="stressLow">Low</label>

  <input type="radio" id="stressMedium" name="stressLevel" value="Medium" />
  <label for="stressMedium">Medium</label>

  <input type="radio" id="stressHigh" name="stressLevel" value="High" />
  <label for="stressHigh">High</label>

  <div id="stressError" class="error-msg"></div>
</div>

      <!-- Checkboxes for emotions felt today -->
<div class="mb-3">
  <label class="form-label">Emotions You’ve Felt Today (choose at least one)</label>

  <div class="form-check">
    <input type="checkbox" id="emotionHappy" name="emotions" value="Happy" class="form-check-input" />
    <label for="emotionHappy" class="form-check-label">Happy</label>
  </div>

  <div class="form-check">
    <input type="checkbox" id="emotionSad" name="emotions" value="Sad" class="form-check-input" />
    <label for="emotionSad" class="form-check-label">Sad</label>
  </div>

  <div class="form-check">
    <input type="checkbox" id="emotionAnxious" name="emotions" value="Anxious" class="form-check-input" />
    <label for="emotionAnxious" class="form-check-label">Anxious</label>
  </div>

  <div id="emotionError" class="error-msg mt-1"></div>
</div>

      <!-- A Section for personalized wellness summary -->
      <section class="card mt-4">
        <header class="card-header bg-secondary text-white">Personalized Wellness Summary</header>
        <div class="card-body p-3">
          <textarea id="wellnessSummary" class="form-control" rows="6" readonly></textarea>
        </div>
      </section>

      <div class="d-flex justify-content-center mt-3">
        <button type="button" class="btn btn-secondary" onclick="createSummary()">Submit</button>
      </div>
    </form>
  </main>


  <script>
    // Updates the current date and time every second
    function refreshDateTime() {
      var now = new Date();
      var dateStr = "Today is " + now.toDateString() + " — Current time: " + now.toLocaleTimeString();
      document.getElementById("currentDateTime").innerHTML = dateStr;
    }
    setInterval(refreshDateTime, 1000);
    refreshDateTime();

    // Generates and displays the wellness summary report through 
    function createSummary() {
      let valid = true;

      // Collect form inputs
       var nameInput = document.getElementById("fullName").value;
       var sleepInput = document.getElementById("hoursSlept").value;
       var selectedStress = document.querySelector('input[name="stressLevel"]:checked');
       var selectedEmotions = document.querySelectorAll('input[name="emotions"]:checked');


      // Clear previous errors
      document.getElementById("nameError").textContent = "";
      document.getElementById("sleepError").textContent = "";
      document.getElementById("stressError").textContent = "";
      document.getElementById("emotionError").textContent = "";

      // Validate name
      if (!nameInput) {
        document.getElementById("nameError").textContent = "Please provide your name.";
        valid = false;
      }

      // Validate sleep hours
     if (sleepInput === "" || isNaN(sleepInput) || sleepInput < 0 || sleepInput > 24) {
    document.getElementById("sleepError").innerHTML = "Please enter a number between 0 and 24.";
    valid = false;
      }

      // Validate stress level
    if (!selectedStress) {
    document.getElementById("stressError").innerHTML = "Please select your current stress level.";
    valid = false;
      }

  // Validate emotions
  if (selectedEmotions.length === 0) {
    document.getElementById("emotionError").innerHTML = "Choose at least one emotion.";
    valid = false;
  }

  if (!valid) {
    return;
  }

  // Summary message
  var summary = "Hi " + nameInput + ",\n";
  summary += "You reported sleeping for " + sleepInput + " hours last night.\n";
  summary += "Your stress level is currently: " + selectedStress.value + ".\n";

  var emotionList = [];
  for (var i = 0; i < selectedEmotions.length; i++) {
    emotionList.push(selectedEmotions[i].value);
  }
  summary += "Emotions experienced today: " + emotionList.join(", ") + ".\n\n";

  if (sleepInput < 5) {
    summary += "It seems your sleep duration is quite low. Try to get more rest.\n";
  } else if (sleepInput > 9) {
    summary += "Sleeping too long can sometimes indicate fatigue or stress.\n";
  } else {
    summary += "Your sleep hours appear to be within a healthy range.\n";
  }

  if (selectedStress.value.toLowerCase() === "high") {
    summary += "Your stress level is high. Consider practicing relaxation techniques or taking breaks.\n";
  }

  document.getElementById("wellnessSummary").value = summary;
}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
